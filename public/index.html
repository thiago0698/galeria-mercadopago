<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Exclusiva | PIX Mercado Pago</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="topo">
        <h1>Galeria Exclusiva</h1>
        <p>Pague via PIX pelo Mercado Pago. A imagem só é liberada após a confirmação do pagamento.</p>
    </header>

    <main class="container">
        <div id="galeria" class="grid-fotos"></div>
    </main>

    <div id="modal-pagamento" class="modal hidden">
        <div class="modal-conteudo">
            <button id="fechar-modal" class="btn-fechar">&times;</button>
            <h2 id="modal-titulo">Desbloquear Foto</h2>
            <p class="preco-modal" id="modal-preco">R$ 0,00</p>

            <div class="form-email">
                <label for="email-comprador">E-mail para recibo:</label>
                <input type="email" id="email-comprador" placeholder="seuemail@exemplo.com" value="cliente@email.com">
                <button id="btn-gerar-pix" class="btn-desbloquear" type="button">Gerar PIX</button>
            </div>

            <div id="area-pix" class="pix-area hidden">
                <p>Escaneie o QR Code ou copie o código PIX:</p>
                <img id="qr-imagem" class="qr-img hidden" alt="QR Code PIX">
                <div class="copia-cola">
                    <input type="text" id="codigo-pix" readonly>
                    <button id="btn-copiar" type="button">Copiar</button>
                </div>
                <p id="status-pagamento" class="status-texto">Aguardando pagamento...</p>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
